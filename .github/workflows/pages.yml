name: Deploy site to GitHub Pages

# Publishes the static site (index.html + assets) to GitHub Pages.
# One-time setup: repo Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions". After that, every push here redeploys the site.

on:
  push:
    branches: ["claude/pensive-thompson-rcys9y", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
